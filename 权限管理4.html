<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --bg2:#f7f6f3;
  --bg3:#f0efe9;
  --border:#d8d6ce;
  --border2:#c8c6bc;
  --text:#1a1a18;
  --text2:#6b6960;
  --text3:#9c9a90;
  --blue:#185FA5;
  --blue-bg:#E6F1FB;
  --teal:#085041;
  --teal-bg:#E1F5EE;
  --coral:#712B13;
  --coral-bg:#FAECE7;
  --amber:#633806;
  --amber-bg:#FAEEDA;
  --green:#27500A;
  --green-bg:#EAF3DE;
  --purple:#3C3489;
  --purple-bg:#EEEDFE;
  --red:#A32D2D;
  --red-bg:#FCEBEB;
  --success:#2d7a3a;
  --danger:#A32D2D;
  --sidebar-w:192px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:var(--text);background:var(--bg3)}
.app{display:grid;grid-template-rows:46px 1fr;height:820px;border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:center;border-bottom:1.5px solid var(--border2);padding:0 8px;gap:0;background:var(--bg)}
.tb{padding:0 16px;height:46px;border:none;background:none;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit;white-space:nowrap;transition:color .15s}
.tb.on{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
.tb:hover:not(.on){color:var(--text)}
.body{display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;height:100%}
.sb{border-right:1.5px solid var(--border2);overflow-y:auto;display:flex;flex-direction:column;background:var(--bg2)}
.sb-lbl{font-size:10px;color:var(--text3);padding:10px 12px 3px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;flex-shrink:0}
.sn{display:flex;align-items:center;gap:4px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text2);position:relative;transition:background .1s;user-select:none;flex-shrink:0}
.sn:hover{background:var(--bg3);color:var(--text)}
.sn.on{background:var(--bg3);color:var(--text);font-weight:500}
.sn.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--text);border-radius:0 2px 2px 0}
.sn-tog{width:12px;height:12px;flex-shrink:0;font-size:8px;color:var(--text3);display:flex;align-items:center;justify-content:center}
.sb-add{padding:6px 10px;flex-shrink:0}
.sb-foot{flex:1}
.sb-div{height:1px;background:var(--border);margin:5px 10px}
.main{overflow-y:auto;background:var(--bg)}
.panel{display:none}
.panel.on{display:block}
.ph{padding:16px 20px 12px;border-bottom:1.5px solid var(--border2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--bg)}
.ph-t{font-size:14px;font-weight:600;color:var(--text)}
.ph-s{font-size:11.5px;color:var(--text2);margin-top:3px}
.sec{padding:14px 20px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-t{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;transition:background .1s;white-space:nowrap;flex-shrink:0;font-weight:500}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-p:hover{opacity:.85}
.btn-d{color:var(--danger);border-color:#f0c0c0}
.btn-d:hover{background:var(--red-bg)}
.btn-g{border-color:transparent}
.btn-g:hover{background:var(--bg2)}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag-p{background:var(--purple-bg);color:var(--purple)}
.tag-t{background:var(--teal-bg);color:var(--teal)}
.tag-c{background:var(--coral-bg);color:var(--coral)}
.tag-a{background:var(--amber-bg);color:var(--amber)}
.tag-g{background:var(--green-bg);color:var(--green)}
.tag-b{background:var(--blue-bg);color:var(--blue)}
.tag-gray{background:var(--bg3);color:var(--text2)}
.tag-on{background:var(--teal-bg);color:var(--teal)}
.tag-off{background:var(--bg3);color:var(--text3)}
.mg{display:flex;flex-direction:column;gap:6px}
.mmod{border:1px solid var(--border);border-radius:7px;overflow:hidden}
.mmod-h{padding:7px 12px;background:var(--bg2);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border)}
.mmod-pages{display:flex;flex-direction:column}
.mpage{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 30px;font-size:12px;color:var(--text2);border-top:1px solid var(--border)}
.mpage:first-child{border-top:none}
.msub{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 54px;font-size:11.5px;color:var(--text2);border-top:1px solid var(--border);background:var(--bg2)}
.msub2{display:flex;align-items:center;gap:7px;padding:3px 12px 3px 78px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);background:var(--bg3)}
.mp-sec{margin:14px 20px;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--bg)}
.mp-sec:first-child{margin-top:16px}
.mp-sec-h{padding:10px 14px;background:linear-gradient(180deg,var(--bg2),var(--bg3));border-bottom:1.5px solid var(--border2);display:flex;align-items:center;gap:10px}
.mp-sec-idx{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.mp-sec-meta{flex:1}
.mp-sec-t{font-size:13px;font-weight:600;color:var(--text);letter-spacing:.3px}
.mp-sec-d{font-size:11px;color:var(--text2);margin-top:2px}
.mp-sec-body{padding:12px 14px}
.ck{width:13px;height:13px;cursor:pointer;accent-color:var(--text);flex-shrink:0}
.atbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.atbl th{text-align:left;padding:7px 10px;color:var(--text2);font-weight:500;font-size:11px;border-bottom:1.5px solid var(--border2);background:var(--bg2)}
.atbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.atbl tr:last-child td{border-bottom:none}
.atbl tr:hover td{background:var(--bg2)}
.av{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;background:var(--teal-bg);color:var(--teal)}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.notice{font-size:11px;color:var(--text2);padding:6px 10px;background:var(--blue-bg);border-left:2.5px solid var(--blue);margin-bottom:10px;border-radius:0 4px 4px 0;color:var(--blue)}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:12px}
.bcr{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);padding:8px 20px 0}
.bcr .sep{color:var(--text3)}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{border:1px solid var(--border);border-radius:7px;padding:10px 12px;cursor:pointer;transition:background .1s;background:var(--bg)}
.rc:hover{background:var(--bg2)}
.rc.on{border-color:var(--text);background:var(--bg2)}
.acct-filters{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2)}
.search-i{padding:5px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);width:180px}
.search-i:focus{outline:none;border-color:#888}
.role-split{display:grid;grid-template-columns:180px 1fr;height:100%}
.role-list-pane{border-right:1.5px solid var(--border2);overflow-y:auto;background:var(--bg2)}
.role-detail-pane{overflow-y:auto;background:var(--bg)}
.ritem{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.ritem:hover{background:var(--bg3)}
.ritem.on{background:var(--bg3)}
.ritem.on::after{content:'';position:absolute;right:0;top:0;bottom:0;width:2.5px;background:var(--text)}
.ritem{position:relative}
.rav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.role-list-header{padding:10px 14px 8px;border-bottom:1.5px solid var(--border2);display:flex;align-items:center;justify-content:space-between;background:var(--bg)}

/* ===== MODAL – fully opaque, no transparency ===== */
.overlay{display:none;position:absolute;inset:0;z-index:50;align-items:flex-start;justify-content:center;padding-top:36px;background:rgba(30,28,24,.52)}
.overlay.on{display:flex}
.modal{background:#ffffff;border-radius:10px;border:1.5px solid var(--border2);width:480px;max-width:96%;max-height:82vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-h{padding:16px 18px 13px;border-bottom:1.5px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#f7f6f3}
.modal-ht{font-size:14px;font-weight:600;color:#1a1a18}
.modal-x{width:24px;height:24px;border:none;background:none;cursor:pointer;font-size:16px;color:#6b6960;display:flex;align-items:center;justify-content:center;border-radius:5px;line-height:1}
.modal-x:hover{background:#e8e7e0}
.modal-b{padding:16px 18px;flex:1;overflow-y:auto;background:#ffffff}
.modal-f{padding:12px 18px;border-top:1.5px solid var(--border2);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:#f7f6f3}
.fr{margin-bottom:13px}
.fr:last-child{margin-bottom:0}
.fl{font-size:11.5px;color:#6b6960;margin-bottom:5px;display:block;font-weight:600}
.fl .req{color:#A32D2D}
.fi{width:100%;padding:7px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12.5px;font-family:inherit;background:#ffffff;color:#1a1a18;transition:border-color .15s}
.fi:focus{outline:none;border-color:#888}
.fi-sel{width:100%;padding:7px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12.5px;font-family:inherit;background:#ffffff;color:#1a1a18}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:10.5px;color:#9c9a90;margin-top:3px}
.radio-row{display:flex;gap:16px;margin-top:5px}
.radio-item{display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;color:#1a1a18}
.radio-item input{accent-color:#1a1a18;width:13px;height:13px}
.mdiv{height:1px;background:var(--border);margin:13px 0}
</style>

<div class="app" id="APP">
<div class="topbar">
  <button class="tb on" onclick="goTab('func')">功能管理</button>
  <button class="tb" onclick="goTab('org')">组织架构</button>
  <button class="tb" onclick="goTab('role')">角色管理</button>
  <button class="tb" onclick="goTab('acct')">账户管理</button>
</div>
<div class="body">
  <div class="sb" id="SB"></div>
  <div class="main" id="MAIN">
    <div class="panel on" id="p-func"></div>
    <div class="panel" id="p-org"></div>
    <div class="panel" id="p-role"></div>
    <div class="panel" id="p-acct"></div>
  </div>
</div>

<!-- Modal 部门 -->
<div class="overlay" id="ov-dept" onclick="if(event.target===this)cm('dept')">
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-h"><span class="modal-ht" id="mh-dept">新增部门</span><button class="modal-x" onclick="cm('dept')">✕</button></div>
  <div class="modal-b">
    <div class="fr"><label class="fl">部门名称 <span class="req">*</span></label><input class="fi" id="f-dept-name" placeholder="请输入部门名称"></div>
    <div class="fr"><label class="fl">所属上级</label><select class="fi-sel fi" id="f-dept-parent"><option value="">— 顶级（集团根节点）—</option></select><div class="hint">不选则作为顶级节点</div></div>
    <div class="fr"><label class="fl">部门描述</label><input class="fi" id="f-dept-desc" placeholder="简述部门职能（选填）"></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="cm('dept')">取消</button><button class="btn btn-p" onclick="saveDept()">确认保存</button></div>
</div></div>

<!-- Modal 角色 -->
<div class="overlay" id="ov-role" onclick="if(event.target===this)cm('role')">
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-h"><span class="modal-ht" id="mh-role">新建角色</span><button class="modal-x" onclick="cm('role')">✕</button></div>
  <div class="modal-b">
    <div class="fr"><label class="fl">角色名称 <span class="req">*</span></label><input class="fi" id="f-role-name" placeholder="如：销售总监、研发工程师"></div>
    <div class="fr"><label class="fl">所属部门 <span class="req">*</span></label><select class="fi-sel fi" id="f-role-dept"></select><div class="hint">角色可分配的功能权限不超出所属部门范围</div></div>
    <div class="fr"><label class="fl">角色职级</label>
      <div class="radio-row">
        <label class="radio-item"><input type="radio" name="rlv" value="high">高级</label>
        <label class="radio-item"><input type="radio" name="rlv" value="mid" checked>中级</label>
        <label class="radio-item"><input type="radio" name="rlv" value="low">普通</label>
      </div>
    </div>
    <div class="fr"><label class="fl">职责描述</label><textarea class="fi" id="f-role-desc" placeholder="简述该角色的主要职责与使用场景" style="height:66px;resize:none"></textarea></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="cm('role')">取消</button><button class="btn btn-p" onclick="saveRole()">确认创建</button></div>
</div></div>

<!-- Modal 账户 -->
<div class="overlay" id="ov-acct" onclick="if(event.target===this)cm('acct')">
<div class="modal" onclick="event.stopPropagation()">
  <div class="modal-h"><span class="modal-ht" id="mh-acct">新建账户</span><button class="modal-x" onclick="cm('acct')">✕</button></div>
  <div class="modal-b">
    <div class="fi-row">
      <div class="fr"><label class="fl">姓名 <span class="req">*</span></label><input class="fi" id="f-an" placeholder="真实姓名"></div>
      <div class="fr"><label class="fl">工号</label><input class="fi" id="f-ano" placeholder="如：LST-0012"></div>
    </div>
    <div class="fi-row">
      <div class="fr"><label class="fl">登录账号 <span class="req">*</span></label><input class="fi" id="f-al" placeholder="字母/数字组合"></div>
      <div class="fr"><label class="fl">手机号</label><input class="fi" id="f-aph" placeholder="用于接收验证码"></div>
    </div>
    <div class="mdiv"></div>
    <div class="fr"><label class="fl">所属部门 <span class="req">*</span></label><select class="fi-sel fi" id="f-adept" onchange="refreshAR()"></select></div>
    <div class="fr"><label class="fl">分配角色</label><select class="fi-sel fi" id="f-arole"></select><div class="hint">仅显示所属部门下已配置的角色</div></div>
    <div class="mdiv"></div>
    <div class="fr"><label class="fl" id="f-pwd-label">登录密码 <span class="req">*</span></label>
      <div style="display:flex;gap:6px">
        <input class="fi" id="f-pwd-new" type="text" placeholder="8 位以上，含大小写/数字/符号 ≥3 类" style="flex:1" oninput="checkPwd()">
        <button type="button" class="btn" onclick="fillDefaultPwd()" title="填入默认初始密码 Lsth@1234">默认密码</button>
      </div>
      <div class="hint" id="f-pwd-hint">至少 8 位，含大小写字母、数字、特殊字符中的 3 类；不能包含登录账号 / 工号 / 常见弱密码</div>
    </div>
    <div class="fr" id="f-pwd-opts">
      <label class="radio-item" style="font-size:12.5px;display:flex"><input type="checkbox" id="f-pwd-force" checked>下次登录强制修改密码</label>
    </div>
    <div class="mdiv"></div>
    <div class="fr"><label class="fl">账户状态</label>
      <div class="radio-row">
        <label class="radio-item"><input type="radio" name="ast" value="active" checked>启用</label>
        <label class="radio-item"><input type="radio" name="ast" value="disabled">停用</label>
      </div>
    </div>
    <div class="fr"><label class="fl">备注</label><input class="fi" id="f-anote" placeholder="选填"></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="cm('acct')">取消</button><button class="btn btn-p" onclick="saveAcct()">确认保存</button></div>
</div></div>

</div>

    let sel=false,oc='';

    if(mode==='role'){sel=curRoleDept===d.id;oc=`selRD('${d.id}')`;}
    if(mode==='acct'){sel=curAcctDept===d.id;oc=`selAD('${d.id}')`;}
    return`<div class="sn${sel?' on':''}" style="padding-left:${12+dep*13}px" onclick="${oc}">

  (m.pages||[]).forEach(p=>{h+=renderPage(p,mon,1);});

function renderPage(p,parentOn,depth){
  const on=FE[p.id]&&parentOn;

/* ──── 密码辅助函数（用于账户编辑 modal 内的密码字段）──── */
const DEFAULT_PWD='Lsth@1234';
function fillDefaultPwd(){
  document.getElementById('f-pwd-new').value=DEFAULT_PWD;
  checkPwd();
}
function validatePwd(pwd,account){
  if(!pwd)return '请输入密码';
  if(pwd.length<8)return '密码至少 8 位';
  let kinds=0;
  if(/[A-Z]/.test(pwd))kinds++;
  if(/[a-z]/.test(pwd))kinds++;
  if(/\d/.test(pwd))kinds++;
  if(/[^A-Za-z0-9]/.test(pwd))kinds++;
  if(kinds<3)return '必须包含大小写字母、数字、特殊字符中至少 3 类';
  if(/^(.)\1+$/.test(pwd))return '不能为单一重复字符';
  if(account){
    if(pwd.toLowerCase().includes(account.login.toLowerCase()))return '不能包含登录账号';
    if(account.no&&pwd.includes(account.no))return '不能包含工号';
    if(pwd.includes(account.name))return '不能包含姓名';
  }
  const weak=['12345678','password','admin123','lsth2025','letmein','qwerty','abc12345','password1','lanshan'];
  if(weak.includes(pwd.toLowerCase()))return '不能使用常见弱密码';
  return null;
}
function checkPwd(){
  const pwd=document.getElementById('f-pwd-new').value;
  const hint=document.getElementById('f-pwd-hint');
  const force=document.getElementById('f-pwd-force');
  const opts=document.getElementById('f-pwd-opts');
  /* 用当前 modal 字段构造临时 account 上下文做校验 */
  const ctx={
    name: document.getElementById('f-an').value.trim(),
    login: document.getElementById('f-al').value.trim(),
    no: document.getElementById('f-ano').value.trim()
  };
  if(!pwd){
    if(edAcct){hint.textContent='留空表示不修改密码';opts.style.opacity='.45';force.disabled=true;}
    else     {hint.textContent='请设置初始密码（至少 8 位，含大小写字母、数字、特殊字符中的 3 类）';opts.style.opacity='1';force.disabled=false;}
    hint.style.color='var(--text3)';
    return;
  }
  opts.style.opacity='1';force.disabled=false;
  const err=validatePwd(pwd,ctx);
  if(err){hint.textContent='✗ '+err;hint.style.color='var(--danger)';}
  else   {hint.textContent='✓ 符合密码强度要求';hint.style.color='var(--success)';}
}

      pwdInput.placeholder='8 位以上，含大小写/数字/符号 ≥3 类';

function saveRole(){
  const name=document.getElementById('f-role-name').value.trim();if(!name)return;

  const desc=document.getElementById('f-role-desc').value.trim()||'自定义角色';
  const lv=document.querySelector('input[name="rlv"]:checked')?.value||'mid';
  const w=lv==='high'?80:lv==='mid'?50:30;
  const col=COLORS[rci++%COLORS.length];
  if(edRole){const r=R(edRole);r.name=name;r.dept=dept;r.desc=desc;r.w=w;}

function delRole(id){
  roles=roles.filter(r=>r.id!==id);
  accounts.forEach(a=>{if(a.role===id)a.role=null;});
  if(curRole===id){curRole=null;curRoleView='list';}
  rSB();rMain();
}
function saveAcct(){
  const name=document.getElementById('f-an').value.trim();
  const login=document.getElementById('f-al').value.trim();
  if(!name||!login)return;
  const no=document.getElementById('f-ano').value.trim();
  const phone=document.getElementById('f-aph').value.trim();
  const dept=document.getElementById('f-adept').value;
  const role=document.getElementById('f-arole').value||null;
  const note=document.getElementById('f-anote').value.trim();
  const status=document.querySelector('input[name="ast"]:checked')?.value||'active';
  const pwd=document.getElementById('f-pwd-new').value;
  const force=document.getElementById('f-pwd-force').checked;
  /* 密码校验：新建必填、编辑选填 */
  if(!edAcct && !pwd){
    document.getElementById('f-pwd-hint').textContent='✗ 新建账户必须设置初始密码';
    document.getElementById('f-pwd-hint').style.color='var(--danger)';
    return;
  }
  if(pwd){
    const err=validatePwd(pwd,{name,login,no});
    if(err){
      document.getElementById('f-pwd-hint').textContent='✗ '+err;
      document.getElementById('f-pwd-hint').style.color='var(--danger)';
      return;
    }
  }
  let target;
  if(edAcct){
    target=accounts.find(x=>x.id===edAcct);
    if(target)Object.assign(target,{name,login,no,phone,dept,role,note,status});
  } else {
    target={id:'a'+Date.now(),name,login,no,phone,dept,role,note,status};
    accounts.push(target);
  }
  /* 密码处理：实际系统只存哈希，原型只打标 */
  if(pwd && target){
    target.mustChangePwd=force;
    target.lastPwdReset=new Date().toISOString();
  }
  cm('acct');rAcct();
  if(pwd){
    const action=edAcct?'已为账户「'+name+'」重置密码':'新账户「'+name+'」已创建并设置初始密码';
    alert(action+(force?'，用户下次登录时需强制修改密码':'')+'。');
  }
}

rSB();rMain();
</script>
